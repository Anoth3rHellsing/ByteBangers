<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b1055"/>
      <stop offset="40%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#0d0221"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#ff9a56"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#c0c0c0"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.2" stroke="#ff6ec7" stroke-width="1">
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="360" x2="512" y2="360"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
    <line x1="0" y1="440" x2="512" y2="440"/>
    <line x1="0" y1="480" x2="512" y2="480"/>
    <line x1="64" y1="280" x2="64" y2="512"/>
    <line x1="128" y1="280" x2="128" y2="512"/>
    <line x1="192" y1="280" x2="192" y2="512"/>
    <line x1="256" y1="280" x2="256" y2="512"/>
    <line x1="320" y1="280" x2="320" y2="512"/>
    <line x1="384" y1="280" x2="384" y2="512"/>
    <line x1="448" y1="280" x2="448" y2="512"/>
  </g>
  <!-- Retro sun -->
  <circle cx="256" cy="300" r="100" fill="url(#sunset)" opacity="0.8" filter="url(#glow)"/>
  <rect x="156" y="310" width="200" height="8" fill="#0d0221"/>
  <rect x="156" y="330" width="200" height="6" fill="#0d0221"/>
  <rect x="156" y="348" width="200" height="5" fill="#0d0221"/>
  <rect x="156" y="364" width="200" height="4" fill="#0d0221"/>
  <!-- Title text -->
  <text x="256" y="180" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="72" font-weight="900" fill="url(#chrome)" filter="url(#glow)" letter-spacing="4">BYTE</text>
  <text x="256" y="250" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="56" font-weight="900" fill="#00d4ff" filter="url(#glow)" letter-spacing="6">BANGERS</text>
  <!-- Music note accent -->
  <g transform="translate(380, 100)" fill="#ff6ec7" filter="url(#glow)">
    <circle cx="0" cy="40" r="12"/>
    <rect x="10" y="0" width="4" height="42"/>
    <path d="M14 0 Q30 5 30 15 Q30 25 14 20 Z"/>
  </g>
</svg>